name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: discovery_today
          MYSQL_USER: discovery_app
          MYSQL_PASSWORD: ci-only-app-password
          MYSQL_ROOT_PASSWORD: ci-only-root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-only-root-password --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      NODE_ENV: test
      API_HOST: 127.0.0.1
      API_PORT: 3000
      WEB_ORIGIN: http://127.0.0.1:5173
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: 3306
      MYSQL_DATABASE: discovery_today
      MYSQL_USER: discovery_app
      MYSQL_PASSWORD: ci-only-app-password
      TEST_AUTH_ENABLED: "true"
      RESEARCH_SAMPLE_MODE: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: npm ci
      - run: npm run contracts:check
      - run: npm run sample:validate
      - run: python -m unittest discover -s services/ingest-python/tests -v
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run db:migrate
      - run: npm run db:migrate
      - run: npm run db:rollback
      - run: npm run db:migrate
      - run: npm run sample:import
      - name: API and web smoke
        shell: bash
        run: |
          npm run start -w @today/api > api.log 2>&1 &
          API_PID=$!
          node apps/web/server.mjs > web.log 2>&1 &
          WEB_PID=$!
          trap 'kill "$API_PID" "$WEB_PID" 2>/dev/null || true' EXIT
          node --input-type=module -e 'for (let i = 0; i < 30; i++) { try { const r = await fetch("http://127.0.0.1:3000/api/v1/health/ready"); if (r.ok) process.exit(0); } catch {} await new Promise(r => setTimeout(r, 1000)); } process.exit(1);'
          node --input-type=module -e 'const api = await fetch("http://127.0.0.1:3000/api/v1/activities?freeOnly=true"); const page = await api.json(); if (!api.ok || !Array.isArray(page.items)) process.exit(1); const web = await fetch("http://127.0.0.1:8080/discover"); if (!web.ok || !(await web.text()).includes("오늘의 발견")) process.exit(1);'

  compose-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and start local stack
        shell: bash
        run: |
          cp .env.example .env
          sed -i 's/change-this-local-password/ci-compose-app-password/' .env
          sed -i 's/change-this-local-root-password/ci-compose-root-password/' .env
          docker compose up --build -d
      - name: Verify readiness
        shell: bash
        run: |
          for i in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000/api/v1/health/ready >/dev/null && curl --fail --silent http://127.0.0.1:8080/discover | grep -q '오늘의 발견'; then exit 0; fi
            sleep 2
          done
          docker compose logs --no-color
          exit 1
      - if: always()
        run: docker compose down --volumes
